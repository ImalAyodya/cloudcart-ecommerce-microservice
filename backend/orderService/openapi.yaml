openapi: 3.0.3
info:
  title: CloudCart Order Service API
  description: |
    API for managing orders in the CloudCart e-commerce platform.
    This service handles order creation, retrieval, cancellation, and validates payment status.
  version: 1.0.0
  contact:
    name: CloudCart Team

servers:
  - url: http://localhost:5003/api/orders
    description: Local development server
  - url: https://order-service.agreeableriver-79a7139e.southeastasia.azurecontainerapps.io/api/orders
    description: Production server

tags:
  - name: Orders
    description: Order management operations
  - name: Admin
    description: Admin-only order operations

paths:
  /:
    post:
      tags:
        - Orders
      summary: Create a new order
      description: Creates a new order for the authenticated user. Requires valid payment transaction ID and sufficient product inventory.
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order created
                  order:
                    $ref: '#/components/schemas/Order'
                  transactionId:
                    type: string
                    example: TXN9ABC1XYZ
                  orderNumber:
                    type: string
                    example: ORD-001
        '400':
          description: Invalid input or insufficient inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Unable to verify payment or insufficient gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Admin
      summary: Get all orders
      description: Retrieves a list of all orders (admin only). Supports pagination.
      operationId: getAllOrders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Results per page (max 100, default unlimited)
          schema:
            type: integer
            maximum: 100
          example: 10
      responses:
        '200':
          description: List of orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{userId}:
    get:
      tags:
        - Orders
      summary: Get orders by user ID
      description: Retrieves all orders for a specific user. Users can only view their own orders unless they are admin.
      operationId: getOrdersByUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Results per page (max 100, default unlimited)
          schema:
            type: integer
            maximum: 100
          example: 10
      responses:
        '200':
          description: List of user orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - cannot view other users' orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: Retrieves a specific order by its ID. Users can only view their own orders unless they are admin.
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - cannot view other users' orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{id}/cancel:
    patch:
      tags:
        - Orders
      summary: Cancel order
      description: Cancels a specific order. Users can only cancel their own orders unless they are admin.
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order cancelled
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID or order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied - cannot cancel other users' orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from User Service login/register endpoint

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the order
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: 507f1f77bcf86cd799439011

    UserId:
      name: userId
      in: path
      required: true
      description: User ID (MongoDB ObjectId or user identifier)
      schema:
        type: string
        example: 507f1f77bcf86cd799439011

  schemas:
    CreateOrderInput:
      type: object
      required:
        - products
        - transactionId
      properties:
        products:
          type: array
          minItems: 1
          description: Array of products to order
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                description: Product ID
                example: 507f1f77bcf86cd799439011
              quantity:
                type: integer
                minimum: 1
                description: Quantity of the product
                example: 2
              productName:
                type: string
                description: Product name (optional, will be resolved from Product Service)
                example: Wireless Headphones
        transactionId:
          type: string
          description: Payment transaction ID from Payment Service
          example: TXN9ABC1XYZ

    Product:
      type: object
      properties:
        productId:
          type: string
          description: Product ID
          example: 507f1f77bcf86cd799439011
        productName:
          type: string
          description: Product name
          example: Wireless Headphones
        quantity:
          type: integer
          description: Quantity ordered
          example: 2
        price:
          type: number
          format: float
          description: Product price at time of order
          example: 99.99

    Order:
      type: object
      properties:
        _id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: MongoDB ObjectId
          example: 507f1f77bcf86cd799439011
        OrderId:
          type: string
          description: Order ID (same as MongoDB ID)
          example: 507f1f77bcf86cd799439011
        OrderNumber:
          type: string
          description: Human-readable order number
          example: ORD-001
        userId:
          type: string
          description: User ID who placed the order
          example: 507f1f77bcf86cd799439011
        products:
          type: array
          description: Array of products in the order
          items:
            $ref: '#/components/schemas/Product'
        totalAmount:
          type: number
          format: float
          description: Total order amount
          example: 199.98
        transactionId:
          type: string
          description: Payment transaction ID
          example: TXN9ABC1XYZ
        paymentStatus:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
          description: Payment status
          example: SUCCESS
        status:
          type: string
          enum:
            - CREATED
            - CONFIRMED
            - FAILED
            - CANCELLED
          description: Order status
          example: CONFIRMED
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the order was last updated
          example: '2024-01-15T10:30:00.000Z'

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: Insufficient stock for product
        error:
          type: string
          description: Error message (alternate field)
          example: Order not found
        missingFields:
          type: array
          items:
            type: string
          description: List of missing required fields
          example:
            - orderId
            - amount